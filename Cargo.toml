[package]
name = "superchain-trace"
version = "0.1.0"
edition = "2021"
description = "Cross-chain message debugger for the OP Superchain"
license = "MIT"
repository = "https://github.com/kcolbchain/superchain-trace"
authors = ["kcolbchain <krishna@kcolbchain.com>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
eyre = "0.6"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
